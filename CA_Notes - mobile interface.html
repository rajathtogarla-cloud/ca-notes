<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Course Hierarchy Viewer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#000000',
                            card: '#111111',
                            border: '#333333',
                            text: '#ffffff',
                            subtext: '#a3a3a3',
                            hover: '#1a1a1a'
                        }
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .noselect { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        input.allow-select, textarea.allow-select { -webkit-user-select: text; user-select: text; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: #333333; }
        
        #loading-overlay { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; transition: opacity 0.3s; }
        
        .marquee-wrapper { overflow: hidden; white-space: nowrap; position: relative; mask-image: linear-gradient(to right, black 0%, black 90%, transparent); -webkit-mask-image: linear-gradient(to right, black 0%, black 90%, transparent); }
        .animate-marquee { display: inline-block; padding-left: 100%; animation: marquee 12s linear infinite; }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        #fileInput { display: none; }
        .level-card { transition: transform 0.15s ease, background-color 0.2s, box-shadow 0.2s; will-change: transform; }
        .level-card:active { transform: scale(0.98); }

        /* --- CLEAN & SPACIOUS NOTES TYPOGRAPHY --- */
        .markdown-body {
            font-size: 0.975rem;
            line-height: 1.85;
            letter-spacing: 0.015em;
            outline: none;
            padding-bottom: 3rem;
        }

        .markdown-body p { margin-top: 0; margin-bottom: 1.15rem; }
        .markdown-body h1 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-top: 1.6rem;
            margin-bottom: 0.75rem;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }
        .markdown-body h2 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-top: 1.35rem;
            margin-bottom: 0.6rem;
        }
        .markdown-body h3 {
            font-size: 1.05rem;
            font-weight: 600;
            margin-top: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .markdown-body ul, .markdown-body ol {
            margin-top: 0.4rem;
            margin-bottom: 1.15rem;
            padding-left: 1.6rem;
        }
        .markdown-body ul { list-style-type: disc; }
        .markdown-body ol { list-style-type: decimal; }
        .markdown-body li {
            margin-top: 0.45rem;
            margin-bottom: 0.45rem;
            line-height: 1.75;
        }
        .markdown-body li > ul, .markdown-body li > ol {
            margin-top: 0.3rem;
            margin-bottom: 0.3rem;
            padding-left: 1.25rem;
        }

        .markdown-body blockquote {
            border-left: 3px solid #818cf8;
            background: rgba(99, 102, 241, 0.04);
            border-radius: 0 0.5rem 0.5rem 0;
            padding: 0.65rem 1rem;
            margin: 1.1rem 0;
            font-style: italic;
        }

        .markdown-body code {
            background-color: rgba(0, 0, 0, 0.05);
            padding: 0.15em 0.4em;
            border-radius: 0.35rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.88em;
            color: #e11d48;
        }

        .dark .markdown-body { color: #e2e8f0; }
        .dark .markdown-body h1 { color: #ffffff; border-bottom-color: #333333; }
        .dark .markdown-body h2, .dark .markdown-body h3 { color: #f1f5f9; }
        .dark .markdown-body blockquote {
            border-left-color: #6366f1;
            background: rgba(99, 102, 241, 0.08);
            color: #cbd5e1;
        }
        .dark .markdown-body code {
            background-color: rgba(255, 255, 255, 0.12);
            color: #fca5a5;
        }

        .cross-note-link {
            text-decoration: underline !important;
            text-underline-offset: 3px;
            color: #2563eb !important;
            cursor: pointer;
            font-weight: 500;
        }
        .dark .cross-note-link { color: #60a5fa !important; }

        .cross-note-link.is-backlink {
            text-decoration: underline double !important;
            text-underline-offset: 3px;
            color: #7c3aed !important;
            font-weight: 600;
        }
        .dark .cross-note-link.is-backlink { color: #a78bfa !important; }

        @keyframes sentenceGlowPulse {
            0% { background-color: #fef08a; color: #000; box-shadow: 0 0 14px #fde047; }
            40% { background-color: #fef08a; color: #000; box-shadow: 0 0 10px #fde047; }
            100% { background-color: transparent; }
        }
        .sentence-highlight {
            animation: sentenceGlowPulse 2.2s ease-out forwards;
            border-radius: 4px;
            padding: 1px 3px;
        }

        @keyframes highlightPulse {
            0% { background-color: var(--pulse-bg); border-color: var(--pulse-color); transform: scale(1.02); box-shadow: 0 0 15px var(--pulse-bg); }
            50% { background-color: var(--pulse-bg-fade); border-color: var(--pulse-color); transform: scale(1); }
            100% { background-color: transparent; border-color: inherit; transform: scale(1); box-shadow: none; }
        }
        .highlight-restore { animation: highlightPulse 1.5s ease-out forwards; }

        /* --- MOBILE NOTES FORMATTING RIBBON --- */
        .notes-ribbon-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 6px 12px;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            flex-shrink: 0;
        }
        .dark .notes-ribbon-bar { background: #111111; border-bottom-color: #333333; }
        .notes-ribbon-bar::-webkit-scrollbar { height: 3px; }
        .ribbon-group { display: inline-flex; align-items: center; gap: 4px; }
        .ribbon-sep {
            display: inline-block;
            width: 1px;
            height: 18px;
            background: #cbd5e1;
            margin: 0 4px;
        }
        .dark .ribbon-sep { background: #333333; }
        .ribbon-btn {
            height: 28px;
            padding: 0 8px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #334155;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }
        .dark .ribbon-btn {
            background: #1a1a1a;
            border-color: #333333;
            color: #cbd5e1;
        }
        .ribbon-btn:active {
            background: #eef2ff;
            color: #4f46e5;
            border-color: #a5b4fc;
        }
        
        /* Active ribbon button state */
        .ribbon-btn-active {
            background: #e0e7ff !important;
            color: #4338ca !important;
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 1px #6366f1;
        }
        .dark .ribbon-btn-active {
            background: #312e81 !important;
            color: #e0e7ff !important;
            border-color: #818cf8 !important;
            box-shadow: 0 0 0 1px #818cf8;
        }

        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 1px #cbd5e1;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.15s ease;
        }
        .dark .color-dot { border-color: #1a1a1a; box-shadow: 0 0 0 1px #475569; }
        .color-dot:active { transform: scale(1.15); }
        .color-dot-active {
            transform: scale(1.22);
            box-shadow: 0 0 0 2.5px #6366f1 !important;
        }

        .swipe-note-active {
            background-color: #faf5ff !important;
            border-color: #c084fc !important;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.15) !important;
        }
        .dark .swipe-note-active {
            background-color: #2e1065 !important;
            border-color: #a855f7 !important;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-dark-bg dark:text-dark-text h-screen flex flex-col overflow-hidden transition-colors duration-200">

    <div id="loading-overlay" class="bg-white/95 dark:bg-dark-bg/95">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600 dark:border-indigo-400"></div>
        <p id="loading-text" class="text-slate-600 dark:text-dark-subtext font-medium animate-pulse">Initializing...</p>
    </div>

    <div id="mobile-login-overlay" class="fixed inset-0 z-[100] hidden flex-col items-center justify-center bg-slate-50/95 dark:bg-dark-bg/95 backdrop-blur-sm transition-opacity">
        <div class="w-11/12 max-w-sm bg-white dark:bg-dark-card rounded-2xl shadow-2xl p-6 border border-slate-200 dark:border-dark-border">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-slate-800 dark:text-dark-text mb-1">Welcome Back</h2>
                <p class="text-sm text-slate-500 dark:text-dark-subtext">Sign in to sync your notes</p>
            </div>
            <div id="login-error" class="hidden mb-4 p-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg text-sm text-red-600 dark:text-red-400 text-center"></div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 dark:text-dark-subtext uppercase mb-1">Email</label>
                    <input type="email" id="mobile-user-email" class="w-full bg-slate-50 dark:bg-dark-bg dark:text-dark-text border border-slate-200 dark:border-dark-border rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all" placeholder="name@example.com">
                </div>
                <div class="relative">
                    <label class="block text-xs font-bold text-slate-500 dark:text-dark-subtext uppercase mb-1">Password</label>
                    <input type="password" id="mobile-user-pass" class="w-full bg-slate-50 dark:bg-dark-bg dark:text-dark-text border border-slate-200 dark:border-dark-border rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all" placeholder="Enter password">
                    <button type="button" id="mobile-btn-show-pass" class="absolute right-3 top-8 text-slate-400 hover:text-indigo-500 dark:hover:text-indigo-400"><i data-lucide="eye" class="w-5 h-5"></i></button>
                </div>
                <button id="mobile-btn-submit-login" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition-colors mt-2 shadow-lg shadow-indigo-200 dark:shadow-none flex items-center justify-center gap-2">
                    <span>Sign In</span>
                </button>
            </div>
        </div>
    </div>

    <!-- OPTIONS OVERLAY -->
    <div id="optionsOverlay" class="fixed inset-0 z-50 hidden flex items-center justify-center" aria-hidden="true">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeAllOverlays()"></div>
        <div class="relative bg-white dark:bg-dark-card rounded-2xl shadow-2xl p-6 w-11/12 max-w-sm transform transition-all scale-100 opacity-100 border border-slate-200 dark:border-dark-border">
            <h3 class="text-center text-lg font-bold text-slate-800 dark:text-dark-text mb-6">Item Options</h3>
            <div class="grid grid-cols-3 gap-y-6 gap-x-2">
                <button onclick="window.openEditModal()" class="flex flex-col items-center gap-2 group">
                    <div class="w-12 h-12 bg-blue-50 dark:bg-blue-900/20 rounded-full flex items-center justify-center text-blue-600 dark:text-blue-400 group-active:bg-blue-100 dark:group-active:bg-blue-900/40 transition-colors"><i data-lucide="pencil" class="w-5 h-5"></i></div>
                    <span class="text-xs font-medium text-slate-600 dark:text-dark-subtext">Edit</span>
                </button>
                <button onclick="window.openNotesModal()" class="flex flex-col items-center gap-2 group">
                    <div class="w-12 h-12 bg-purple-50 dark:bg-purple-900/20 rounded-full flex items-center justify-center text-purple-600 dark:text-purple-400 group-active:bg-purple-100 dark:group-active:bg-purple-900/40 transition-colors"><span class="text-xl font-bold">✦</span></div>
                    <span class="text-xs font-medium text-slate-600 dark:text-dark-subtext">Notes</span>
                </button>
                <button onclick="window.switchToPathView()" class="flex flex-col items-center gap-2 group">
                    <div class="w-12 h-12 bg-indigo-50 dark:bg-indigo-900/20 rounded-full flex items-center justify-center text-indigo-600 dark:text-indigo-400 group-active:bg-indigo-100 dark:group-active:bg-indigo-900/40 transition-colors"><i data-lucide="map" class="w-5 h-5"></i></div>
                    <span class="text-xs font-medium text-slate-600 dark:text-dark-subtext">Path</span>
                </button>
                <button id="btnOptionAddChild" onclick="window.addChildItem()" class="flex flex-col items-center gap-2 group transition-opacity">
                    <div class="w-12 h-12 bg-green-50 dark:bg-green-900/20 rounded-full flex items-center justify-center text-green-600 dark:text-green-400 group-active:bg-green-100 dark:group-active:bg-green-900/40 transition-colors"><i data-lucide="plus" class="w-6 h-6"></i></div>
                    <span class="text-xs font-medium text-slate-600 dark:text-dark-subtext">Add Child</span>
                </button>
                <button onclick="window.startMoveOperation()" class="flex flex-col items-center gap-2 group">
                    <div class="w-12 h-12 bg-amber-50 dark:bg-amber-900/20 rounded-full flex items-center justify-center text-amber-600 dark:text-amber-400 group-active:bg-amber-100 dark:group-active:bg-amber-900/40 transition-colors"><i data-lucide="move" class="w-5 h-5"></i></div>
                    <span class="text-xs font-medium text-slate-600 dark:text-dark-subtext">Move</span>
                </button>
                <button onclick="window.deleteItem()" class="flex flex-col items-center gap-2 group">
                    <div class="w-12 h-12 bg-red-50 dark:bg-red-900/20 rounded-full flex items-center justify-center text-red-600 dark:text-red-400 group-active:bg-red-100 dark:group-active:bg-red-900/40 transition-colors"><i data-lucide="trash-2" class="w-5 h-5"></i></div>
                    <span class="text-xs font-medium text-slate-600 dark:text-dark-subtext">Delete</span>
                </button>
                <button id="btnSetPending" onclick="window.setAsPending()" class="flex flex-col items-center gap-2 group">
                    <div class="w-12 h-12 bg-amber-50 dark:bg-amber-900/20 rounded-full flex items-center justify-center text-amber-600 dark:text-amber-400 group-active:bg-amber-100 dark:group-active:bg-amber-900/40 transition-colors">
                        <span class="text-xl">🎯</span>
                    </div>
                    <span class="text-xs font-medium text-slate-600 dark:text-dark-subtext">Set Pending</span>
                </button>
            </div>
            <button onclick="closeAllOverlays()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-dark-text"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
    </div>

    <!-- EDIT OVERLAY -->
    <div id="editOverlay" class="fixed inset-0 z-[60] hidden flex items-end sm:items-center justify-center" aria-hidden="true">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeAllOverlays()"></div>
        <div class="relative bg-white dark:bg-dark-card w-full sm:w-96 rounded-t-2xl sm:rounded-2xl shadow-xl p-6 transform transition-transform duration-300 translate-y-0 border border-slate-200 dark:border-dark-border">
            <h3 class="text-lg font-bold text-slate-800 dark:text-dark-text mb-4">Edit Item</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 dark:text-dark-subtext uppercase mb-1">Title</label>
                    <textarea id="editTitleInput" rows="2" class="allow-select w-full bg-slate-50 dark:bg-dark-bg dark:text-dark-text border border-slate-200 dark:border-dark-border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>
                <div id="editCategoryContainer">
                    <label class="block text-xs font-bold text-slate-500 dark:text-dark-subtext uppercase mb-1">Category (e.g. CA Final, CA Inter)</label>
                    <input type="text" id="editCategoryInput" class="allow-select w-full bg-slate-50 dark:bg-dark-bg dark:text-dark-text border border-slate-200 dark:border-dark-border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. CA Final">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 dark:text-dark-subtext uppercase mb-1">PDF Page Number</label>
                    <input type="number" id="editPageInput" class="allow-select w-full bg-slate-50 dark:bg-dark-bg dark:text-dark-text border border-slate-200 dark:border-dark-border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. 23">
                </div>
                <button onclick="window.saveEdit()" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl active:bg-blue-700 transition-colors shadow-lg shadow-blue-200 dark:shadow-none">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- FULL-SCREEN NOTES INTERFACE -->
    <div id="notesOverlay" class="fixed inset-0 z-[60] hidden flex flex-col bg-white dark:bg-dark-card w-full h-full" aria-hidden="true">
        <div class="flex items-center justify-between px-4 py-3 border-b border-slate-200 dark:border-dark-border flex-none bg-slate-50/70 dark:bg-dark-bg/70">
            <div class="flex items-center gap-2 min-w-0">
                <span class="text-purple-600 dark:text-purple-400 text-lg flex-none">✦</span>
                <h3 id="notesModalTitle" class="text-base font-bold text-slate-800 dark:text-dark-text truncate">Notes</h3>
            </div>
            <div class="flex items-center gap-2 flex-none">
                <button id="btnNoteDoneEditing" onclick="window.finishEditingNote()" class="hidden text-xs sm:text-sm font-semibold text-emerald-600 dark:text-emerald-400 hover:text-emerald-700 px-3 py-1.5 bg-emerald-50 dark:bg-emerald-900/30 rounded-lg transition-colors">Done</button>
                <button onclick="window.saveNotes()" class="text-xs sm:text-sm font-semibold text-blue-600 dark:text-blue-400 hover:text-blue-700 px-3 py-1.5 bg-blue-50 dark:bg-blue-900/20 rounded-lg border border-blue-200 dark:border-blue-900/40 transition-colors">Save &amp; Close</button>
                <button onclick="window.closeAllOverlays()" class="text-slate-400 hover:text-slate-600 dark:hover:text-dark-text p-1.5 rounded-lg transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
        </div>

        <!-- Note Tabs Row -->
        <div class="flex items-center gap-2 px-4 py-2.5 border-b border-slate-100 dark:border-dark-border flex-none bg-white dark:bg-dark-card overflow-x-auto">
            <div id="notesTabsList" class="flex items-center gap-2 flex-nowrap"></div>
            <button onclick="window.addNewNoteTab()" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-purple-50 dark:bg-purple-900/20 text-purple-600 dark:text-purple-400 border border-purple-200 dark:border-purple-800/40 hover:bg-purple-100 transition-colors flex-none flex items-center gap-1" title="Add Note Tab">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                <span>Add Note</span>
            </button>
        </div>

        <!-- TWO-STEP STAGED LINK BANNER -->
        <div id="stagedLinkBanner" class="hidden px-4 py-2.5 bg-purple-50 dark:bg-purple-950/40 border-b border-purple-200 dark:border-purple-800 text-xs text-purple-800 dark:text-purple-200 flex items-center justify-between gap-3 transition-all flex-none">
            <div class="flex items-center gap-2 min-w-0">
                <span class="text-base flex-none">🔗</span>
                <span id="stagedLinkBannerText" class="truncate font-medium">Linking on Hold</span>
            </div>
            <button onclick="window.cancelStagedLink()" class="flex-none px-2 py-0.5 rounded bg-purple-200/60 dark:bg-purple-800/50 hover:bg-purple-300 text-purple-900 dark:text-purple-100 font-bold text-[11px] transition-colors">Cancel</button>
        </div>

        <!-- FORMATTING RIBBON WITH ACTIVE STATE IDS -->
        <div id="notesRibbonBar" class="notes-ribbon-bar">
            <!-- INSERT UNDO / REDO GROUP HERE -->
            <div class="ribbon-group">
                <button id="btn-undo" class="ribbon-btn" onclick="window.noteUndo()" title="Undo">
                    <i data-lucide="undo-2" class="w-4 h-4"></i>
                </button>
                <button id="btn-redo" class="ribbon-btn" onclick="window.noteRedo()" title="Redo">
                    <i data-lucide="redo-2" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="ribbon-sep"></div>

            <div class="ribbon-group">
                <button id="btn-h1" class="ribbon-btn" onclick="window.applyHeading(1)">H1</button>
                <button id="btn-h2" class="ribbon-btn" onclick="window.applyHeading(2)">H2</button>
                <button id="btn-h3" class="ribbon-btn" onclick="window.applyHeading(3)">H3</button>
            </div>

            <div class="ribbon-sep"></div>

            <div class="ribbon-group">
                <button id="btn-bold" class="ribbon-btn" onclick="window.applyFormat('bold')"><b>B</b></button>
                <button id="btn-italic" class="ribbon-btn" onclick="window.applyFormat('italic')"><i>I</i></button>
                <button id="btn-underline" class="ribbon-btn" onclick="window.applyFormat('underline')"><u>U</u></button>
                <button id="btn-strike" class="ribbon-btn" onclick="window.applyFormat('strike')"><s>S</s></button>
            </div>

            <div class="ribbon-sep"></div>

            <div class="ribbon-group">
                <button id="btn-bullet" class="ribbon-btn" onclick="window.applyBullet()">• Bullet</button>
            </div>

            <div class="ribbon-sep"></div>

            <div id="ribbonLinkGroup" class="ribbon-group">
                <button id="btnStartLink" class="ribbon-btn text-purple-600 dark:text-purple-400 font-semibold" onclick="window.startStagedLink()">🔗 Start Link</button>
            </div>

            <div class="ribbon-sep"></div>

            <div class="ribbon-group">
                <button class="color-dot" data-color="#ef4444" style="background:#ef4444;" onclick="window.applyColor('#ef4444')"></button>
                <button class="color-dot" data-color="#10b981" style="background:#10b981;" onclick="window.applyColor('#10b981')"></button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        if (typeof marked !== 'undefined') {
            marked.use({
                renderer: {
                    link(href, title, text) {
                        let actualHref = href;
                        let linkText = text;
                        if (typeof href === 'object' && href !== null) {
                            actualHref = href.href;
                            linkText = this.parser.parseInline(href.tokens);
                        }

                        if (actualHref && actualHref.startsWith('#note:')) {
                            const match = actualHref.match(/^#note:(\d+):([^?]+)(\?backlink=1)?/);
                            if (match) {
                                const targetTab = parseInt(match[1], 10);
                                const targetAnchor = match[2];
                                const isBacklink = !!match[3];
                                // If targetTab is 0 (legacy), display as 1; otherwise display targetTab
                                const tabDisplay = targetTab === 0 ? 1 : targetTab;
                                const linkTitle = isBacklink ? `↳ Back-link: Leads to Notes ${tabDisplay}` : `🔗 Link: Leads to Notes ${tabDisplay}`;
                                const cls = `cross-note-link ${isBacklink ? 'is-backlink' : ''}`;
                                return `<a href="${actualHref}" class="${cls}" data-target-tab="${targetTab}" data-target-anchor="${targetAnchor}" title="${linkTitle}" onclick="window.handleCrossNoteLinkClick(event, ${targetTab}, '${targetAnchor}')">${linkText}</a>`;
                            }
                        }

                        return `<a href="${actualHref}" target="_blank" rel="noopener noreferrer" title="${title || ''}">${linkText}</a>`;
                    }
                }
            });
        }

        let db = null;
        let auth = null;
        let metaRef = null;
        let oldLegacyRef = null;

        try {
            const firebaseConfig = {
                apiKey: "AIzaSyD6N8jHWJdLfc87NrBs8_ZgtKmRV1gR7h0",
                authDomain: "ca-notes143.firebaseapp.com",
                projectId: "ca-notes143",
                storageBucket: "ca-notes143.firebasestorage.app",
                messagingSenderId: "519846107572",
                appId: "1:519846107572:web:42747869d5aa5896a47ae1",
                measurementId: "G-Q4LQ77ZDM6"
            };
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            metaRef = doc(db, "personal_notes", "ca_hq_meta");
            oldLegacyRef = doc(db, "personal_notes", "ca_final_pad");
        } catch (e) {
            console.warn("Firebase Init Failed.", e);
        }

        const DEFAULT_DATA = {
          "subjects": [
            { "id": "EX_Sub", "name": "Example Subject", "category": "CA Final", "chapters": [
                { "id": "ch1", "title": "Start Here", "desc": "Long press items for options.", "children": [] }
            ]}
          ]
        };

        let rawData = null;
        let navStack = []; 
        let currentView = { items: [], title: 'Categories', level: 0, parentLink: null };
        let activeItem = null;
        let activeItemList = null; 
        let activeItemLevel = 0;
        let moveClipboard = { item: null, sourceList: null };

        let currentNotesList = [''];
        let activeNoteIdx = 0;
        let lastTapTime = 0;
        let stagedLink = null;

        const overlay = document.getElementById('loading-overlay');
        const loadText = document.getElementById('loading-text');
        const loginOverlay = document.getElementById('mobile-login-overlay');
        
        const isDark = localStorage.getItem('darkMode') === 'true';
        if(isDark) document.documentElement.classList.add('dark');

        if (!auth) {
            if(loadText) {
                loadText.innerText = "Offline Mode (Firebase Blocked)";
                loadText.classList.add("text-amber-500", "text-center", "px-4");
                loadText.innerHTML += `<br><br><button onclick="window.loadData(DEFAULT_DATA); document.getElementById('loading-overlay').style.display='none';" class="px-4 py-2 bg-slate-200 text-slate-800 rounded-lg text-sm mt-4">Load Offline Mode</button>`;
            }
        } else {
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    if (loginOverlay) {
                        loginOverlay.classList.remove('flex');
                        loginOverlay.classList.add('hidden');
                    }
                    if (overlay) overlay.style.display = 'flex';

                    if(db) {
                        try {
                            if (loadText) loadText.innerText = "Syncing Cloud Data...";
                            let finalSubjects = [];
                            
                            const fetchWithTimeout = (promise, ms) => {
                                let timeoutId;
                                const timeoutPromise = new Promise((_, reject) => {
                                    timeoutId = setTimeout(() => reject(new Error("Connection Timeout")), ms);
                                });
                                return Promise.race([promise, timeoutPromise]).finally(() => clearTimeout(timeoutId));
                            };

                            const metaSnap = await fetchWithTimeout(getDoc(metaRef), 15000);
                            
                            if (metaSnap.exists()) {
                                if (loadText) loadText.innerText = "Downloading Subjects...";
                                const metaData = metaSnap.data();
                                const subjectList = metaData.subjectList || [];
                                
                                const promises = subjectList.map(subItem => getDoc(doc(db, "ca_hq_subjects", subItem.id)));
                                const snapshots = await fetchWithTimeout(Promise.all(promises), 15000);
                                
                                snapshots.forEach((snap, idx) => {
                                    if(snap.exists()) {
                                        const r = snap.data();
                                        const parsed = r.subjectData ? JSON.parse(r.subjectData) : r;
                                        if (subjectList[idx] && subjectList[idx].category && !parsed.category) {
                                            parsed.category = subjectList[idx].category;
                                        }
                                        if (subjectList[idx] && subjectList[idx].pendingNodeId) {
                                            parsed.pendingNodeId = subjectList[idx].pendingNodeId;
                                        }
                                        finalSubjects.push(parsed);
                                    }
                                });
                            } else {
                                const oldSnap = await fetchWithTimeout(getDoc(oldLegacyRef), 15000);
                                if (oldSnap.exists()) finalSubjects = JSON.parse(oldSnap.data().hierarchyData).subjects || [];
                            }

                            if(finalSubjects.length > 0) {
                                if (loadText) loadText.innerText = "Building UI...";
                                setTimeout(() => {
                                    try {
                                        if (window.loadData) window.loadData({ subjects: finalSubjects });
                                        if (overlay) overlay.style.display = 'none';
                                    } catch(e) {
                                        console.error("UI Render Error:", e);
                                    }
                                }, 100);
                                return;
                            }
                        } catch (e) {
                            console.error("Cloud load error", e);
                        }
                    }

                    if (loadText) loadText.innerText = "Loading Default Data...";
                    setTimeout(() => { 
                        if (window.loadData) window.loadData(DEFAULT_DATA);
                        if (overlay) overlay.style.display = 'none'; 
                    }, 500);

                } else {
                    if (overlay) overlay.style.display = 'none';
                    if (loginOverlay) {
                        loginOverlay.classList.remove('hidden');
                        loginOverlay.classList.add('flex');
                    }
                    if (window.lucide) lucide.createIcons();
                }
            });
        }

        document.getElementById('mobile-btn-submit-login')?.addEventListener('click', async () => {
            const email = document.getElementById('mobile-user-email').value;
            const pass = document.getElementById('mobile-user-pass').value;
            const errorBox = document.getElementById('login-error');
            const btn = document.getElementById('mobile-btn-submit-login');

            if(!email || !pass) {
                errorBox.textContent = "Please enter both email and password.";
                errorBox.classList.remove('hidden');
                return;
            }

            btn.innerHTML = `<div class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div><span>Verifying...</span>`;
            btn.disabled = true;
            errorBox.classList.add('hidden');

            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (error) {
                btn.innerHTML = `<span>Sign In</span>`;
                btn.disabled = false;
                errorBox.textContent = "Incorrect email or password.";
                errorBox.classList.remove('hidden');
            }
        });

        document.getElementById('mobile-btn-logout')?.addEventListener('click', async () => {
            if(confirm("Are you sure you want to log out?")) {
                await signOut(auth);
                window.location.reload(); 
            }
        });

        document.getElementById('mobile-btn-show-pass')?.addEventListener('click', () => {
            const passInput = document.getElementById('mobile-user-pass');
            const icon = document.querySelector('#mobile-btn-show-pass i');
            if (passInput.type === "password") {
                passInput.type = "text";
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                passInput.type = "password";
                icon.setAttribute('data-lucide', 'eye');
            }
            if(window.lucide) lucide.createIcons();
        });

        window.buildCategoryFolders = function(subjects) {
            const categoriesMap = {};
            subjects.forEach(sub => {
                const catName = sub.category || sub.group || sub.course || "Uncategorized";
                if (!categoriesMap[catName]) {
                    categoriesMap[catName] = [];
                }
                categoriesMap[catName].push(sub);
            });

            return Object.keys(categoriesMap).map(catName => ({
                id: 'cat_' + catName.replace(/\s+/g, '_'),
                name: catName,
                isCategoryFolder: true,
                children: categoriesMap[catName]
            }));
        }

        window.loadData = function(data) {
            rawData = data;
            const categoryFolders = window.buildCategoryFolders(rawData.subjects || []);
            const initialState = { items: categoryFolders, title: 'Categories', level: 0, parentLink: null };
            currentView = initialState;
            navStack = []; 
            history.replaceState({ navStack: [], currentView: initialState }, 'Root', null);
            window.updateUI(false); 
            window.updateStats(data);
        }

        window.navigateBack = function() {
            if (navStack.length > 0) history.back();
        }

        // Reconnect stale snapshot items to live data references on back/forward
        window.reconnectItemsToMaster = function(items) {
            if (!items || !Array.isArray(items) || !rawData) return items;
            return items.map(snapItem => {
                if (snapItem.isCategoryFolder) {
                    const freshFolders = window.buildCategoryFolders(rawData.subjects || []);
                    const matchedFolder = freshFolders.find(f => f.id === snapItem.id || f.name === snapItem.name);
                    return matchedFolder || snapItem;
                }
                const found = window.findPathToNodeById(rawData.subjects || [], snapItem.id);
                return (found && found.foundNode) ? found.foundNode : snapItem;
            });
        };

        window.onpopstate = function(event) {
            if (event.state) {
                navStack = event.state.navStack || [];
                currentView = event.state.currentView;

                // Re-hydrate current view with latest modified live node tree
                if (currentView && currentView.items) {
                    currentView.items = window.reconnectItemsToMaster(currentView.items);
                }
                
                window.closeAllOverlays();
                window.updateUI(true, 'left');

                const savedScroll = event.state.restoreScroll;
                const highlightId = event.state.restoreHighlight;

                setTimeout(() => {
                    const container = document.getElementById('mainContainer');
                    if (savedScroll !== undefined) container.scrollTop = savedScroll;
                    if (highlightId) {
                        const el = document.getElementById('node-' + highlightId);
                        if(el) {
                            el.classList.add('highlight-restore');
                            setTimeout(() => el.classList.remove('highlight-restore'), 2000);
                        }
                    }
                }, 50);

            } else {
                window.loadData(rawData || DEFAULT_DATA);
            }
        };

        window.toggleDarkMode = function() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            localStorage.setItem('darkMode', html.classList.contains('dark'));
        }

        window.openFileActionsModal = function() { document.getElementById('fileActionsOverlay').classList.remove('hidden'); }
        window.closeFileActionsModal = function() { document.getElementById('fileActionsOverlay').classList.add('hidden'); }

        window.triggerSaveToCloud = function() { window.closeFileActionsModal(); window.saveToCloud(); }
        window.triggerImportFile = function() { window.closeFileActionsModal(); document.getElementById('fileInput').click(); }

        window.navigateTo = function(title, items, level, link, clickedItemId) {
            const searchInput = document.getElementById('searchInput');
            if (searchInput && searchInput.value) {
                searchInput.value = '';
                document.getElementById('clearSearchBtn')?.classList.add('hidden');
            }

            const scrollPos = document.getElementById('mainContainer').scrollTop;
            
            const currentStateToSave = { 
                navStack: navStack,
                currentView: currentView,
                restoreScroll: scrollPos,
                restoreHighlight: clickedItemId
            };
            history.replaceState(currentStateToSave, document.title, null);

            navStack.push(currentView);
            currentView = { items: items, title: title, level: level, parentLink: link };
            
            history.pushState({ navStack: navStack, currentView: currentView }, title, null);
            
            window.updateUI(true, 'right');
            document.getElementById('mainContainer').scrollTop = 0;
        }

        window.updateUI = function(animate = true, direction = 'right') {
            const container = document.getElementById('mainContainer');
            const headerTitle = document.getElementById('headerTitle');
            const backBtn = document.getElementById('backBtn');
            const btnAddLevel = document.getElementById('btnAddLevel');
            const btnDarkModeToggle = document.getElementById('btnDarkModeToggle');
            const btnPendingHeader = document.getElementById('btnPendingHeader');
            const searchBarContainer = document.getElementById('searchBarContainer');

            if (currentView.level === 0 || currentView.level === 99) {
                if (searchBarContainer) searchBarContainer.classList.remove('hidden');
                btnAddLevel.classList.remove('hidden');
                btnDarkModeToggle.classList.remove('hidden');
                btnPendingHeader.classList.add('hidden');
            } else {
                if (searchBarContainer) searchBarContainer.classList.add('hidden');
                btnAddLevel.classList.add('hidden');
                btnDarkModeToggle.classList.add('hidden');
                btnPendingHeader.classList.add('hidden');
                
                if (currentView.level >= 2) {
                    const activeSub = window.getSubjectContext();
                    if (activeSub && activeSub.pendingNodeId) {
                        btnPendingHeader.classList.remove('hidden');
                    }
                }
            }
            
            headerTitle.textContent = currentView.title;
            const wrapper = document.getElementById('headerTitleWrapper');
            headerTitle.classList.remove('animate-marquee');
            setTimeout(() => { if (headerTitle.scrollWidth > wrapper.clientWidth) headerTitle.classList.add('animate-marquee'); }, 50);

            if (navStack.length > 0) { backBtn.classList.remove('hidden'); backBtn.onclick = window.navigateBack; } 
            else { backBtn.classList.add('hidden'); }

            const listHtml = document.createElement('div');
            listHtml.className = `space-y-3 ${animate ? (direction === 'right' ? 'slide-in-right' : 'slide-in-left') : ''}`;

            if (!currentView.items || currentView.items.length === 0) {
                listHtml.innerHTML = `<div class="flex flex-col items-center justify-center h-64 text-slate-400 text-center"><i data-lucide="folder-open" class="w-12 h-12 mb-3 text-slate-300 dark:text-dark-subtext"></i><p>Empty</p></div>`;
            } else {
                currentView.items.forEach(item => {
                    listHtml.appendChild(window.createItemCard(item, currentView.level, currentView.parentLink, currentView.items));
                });
            }

            container.innerHTML = '';
            container.appendChild(listHtml);
            lucide.createIcons();
        }

        window.createItemCard = function(item, level, parentLink, itemList) {
            if (!item.id) item.id = 'gen_' + Math.random().toString(36).substr(2, 9);
            
            const title = item.name || item.title || "Untitled";
            const children = item.chapters || item.children || [];
            const hasChildren = children.length > 0;
            const currentLink = item.link || parentLink;

            const styles = [
                { border: 'bg-indigo-600', icon: 'bg-indigo-50 text-indigo-600 dark:bg-indigo-900/20 dark:text-indigo-400', text: 'text-slate-800 dark:text-dark-text' },
                { border: 'bg-blue-500', icon: 'bg-blue-50 text-blue-600 dark:bg-blue-900/20 dark:text-blue-400', text: 'text-slate-800 dark:text-dark-text' },
                { border: 'bg-teal-500', icon: 'bg-teal-50 text-teal-600 dark:bg-teal-900/20 dark:text-teal-400', text: 'text-slate-800 dark:text-dark-text' },
                { border: 'bg-amber-500', icon: 'bg-amber-50 text-amber-600 dark:bg-amber-900/20 dark:text-amber-400', text: 'text-slate-800 dark:text-dark-text' }
            ][Math.min(level, 3)];

            const colorMap = [
                ['#6366f1', 'rgba(99, 102, 241, 0.2)', 'rgba(99, 102, 241, 0.05)'],
                ['#3b82f6', 'rgba(59, 130, 246, 0.2)', 'rgba(59, 130, 246, 0.05)'],
                ['#14b8a6', 'rgba(20, 184, 166, 0.2)', 'rgba(20, 184, 166, 0.05)'],
                ['#f59e0b', 'rgba(245, 158, 11, 0.2)', 'rgba(245, 158, 11, 0.05)']
            ][Math.min(level, 3)];

            const card = document.createElement('div');
            card.id = 'node-' + item.id; 
            
            card.style.setProperty('--pulse-color', colorMap[0]);
            card.style.setProperty('--pulse-bg', colorMap[1]);
            card.style.setProperty('--pulse-bg-fade', colorMap[2]);

            card.className = `level-card noselect relative bg-white dark:bg-dark-card rounded-xl shadow-sm border border-slate-200 dark:border-dark-border overflow-hidden flex flex-col ${hasChildren || item.isCategoryFolder ? 'cursor-pointer' : ''}`;
            
            let longPressTimer = null;
            let isDragging = false;
            let startX = 0, startY = 0;
            let currentX = 0, currentY = 0;
            let longPressTriggered = false;
            let isSwipingRight = false;
            let swipeNoteTriggered = false;

            const handleStart = (x, y) => {
                isDragging = false;
                longPressTriggered = false;
                isSwipingRight = false;
                swipeNoteTriggered = false;
                startX = x; startY = y;
                currentX = x; currentY = y;

                if (!item.isCategoryFolder) {
                    longPressTimer = setTimeout(() => {
                        longPressTriggered = true;
                        if (navigator.vibrate) navigator.vibrate(50);
                        window.triggerLongPressOptions(item, itemList, level);
                    }, 500);
                }
            };

            const handleMove = (x, y) => {
                currentX = x; currentY = y;
                const diffX = currentX - startX;
                const diffY = currentY - startY;

                if (!item.isCategoryFolder && diffX > 15 && Math.abs(diffX) > Math.abs(diffY)) {
                    isSwipingRight = true;
                    isDragging = true;
                    clearTimeout(longPressTimer);

                    const translateX = Math.min(diffX * 0.55, 75);
                    card.style.transition = 'none';
                    card.style.transform = `translateX(${translateX}px)`;

                    if (diffX >= 60) {
                        card.classList.add('swipe-note-active');
                    } else {
                        card.classList.remove('swipe-note-active');
                    }
                } else if (Math.abs(diffX) > 10 || Math.abs(diffY) > 10) {
                    isDragging = true;
                    clearTimeout(longPressTimer);
                }
            };

            const handleEnd = () => {
                clearTimeout(longPressTimer);
                const diffX = currentX - startX;

                if (isSwipingRight) {
                    card.style.transition = 'transform 0.25s ease, background-color 0.2s';
                    card.style.transform = '';
                    card.classList.remove('swipe-note-active');

                    if (diffX >= 60 && !longPressTriggered && !item.isCategoryFolder) {
                        swipeNoteTriggered = true;
                        if (navigator.vibrate) navigator.vibrate(35);
                        activeItem = item;
                        activeItemList = itemList;
                        activeItemLevel = level;
                        window.openNotesModal();
                        setTimeout(() => { swipeNoteTriggered = false; isDragging = false; }, 350);
                        return;
                    }
                }
                card.style.transition = 'transform 0.2s ease';
                card.style.transform = '';
            };

            card.addEventListener('touchstart', (e) => handleStart(e.touches[0].clientX, e.touches[0].clientY), {passive: true});
            card.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientX, e.touches[0].clientY), {passive: true});
            card.addEventListener('touchend', handleEnd);
            card.addEventListener('touchcancel', handleEnd);
            
            card.addEventListener('mousedown', (e) => { if(e.button === 0) handleStart(e.clientX, e.clientY); });
            card.addEventListener('mousemove', (e) => { if(e.buttons === 1) handleMove(e.clientX, e.clientY); });
            card.addEventListener('mouseup', handleEnd);
            card.addEventListener('mouseleave', handleEnd);

            card.oncontextmenu = (e) => e.preventDefault();

            card.onclick = (e) => {
                if(longPressTriggered || isDragging || swipeNoteTriggered) {
                    e.stopPropagation(); 
                    e.preventDefault(); 
                    return;
                }
                if (hasChildren || item.isCategoryFolder) {
                    window.navigateTo(title, children, level + 1, currentLink, item.id);
                }
            };

            const borderIndicator = document.createElement('div');
            borderIndicator.className = `absolute left-0 top-0 bottom-0 w-1.5 ${styles.border}`;
            card.appendChild(borderIndicator);

            const content = document.createElement('div');
            content.className = `p-4 pl-5 flex items-start gap-3 active:bg-slate-50 dark:active:bg-dark-hover transition-colors`;

            const iconContainer = document.createElement('div');
            iconContainer.className = `icon-trigger mt-1 p-2 rounded-lg flex-none ${styles.icon} cursor-pointer active:scale-90 transition-transform z-10`;
            
            let iconName = hasChildren ? 'folder' : 'file-text';
            if (item.isCategoryFolder) iconName = 'folder-closed';
            else if (level === 1) iconName = 'library';
            if (!hasChildren && !item.isCategoryFolder && (item.pdfPage || currentLink)) iconName = 'book-open';
            
            iconContainer.innerHTML = `<i data-lucide="${iconName}" class="w-5 h-5"></i>`;
            iconContainer.onmousedown = (e) => e.stopPropagation(); 
            iconContainer.ontouchstart = (e) => e.stopPropagation();
            iconContainer.onclick = (e) => {
                e.stopPropagation();
                if (item.pdfPage || currentLink) window.openLink(e, currentLink, item.pdfPage);
            };

            const textContainer = document.createElement('div');
            textContainer.className = 'flex-1 min-w-0 pointer-events-none'; 
            
            const titleEl = document.createElement('h3');
            titleEl.className = `text-sm font-semibold ${styles.text} whitespace-normal break-words leading-snug`;
            titleEl.textContent = title;

            if (item.pdfPage) {
                const pg = document.createElement('span');
                pg.className = 'inline-block mt-1 bg-slate-100 dark:bg-dark-hover text-slate-500 dark:text-dark-subtext text-[10px] font-bold px-1.5 py-0.5 rounded border border-slate-200 dark:border-dark-border ml-1 align-middle';
                pg.textContent = `Pg ${item.pdfPage}`;
                titleEl.appendChild(pg);
            }
            
            const hasNotes = Array.isArray(item.notes) 
                ? item.notes.some(n => n && n.trim()) 
                : (typeof item.notes === 'string' && item.notes.trim());
            if (hasNotes) {
                const note = document.createElement('span');
                note.className = 'inline-block mt-1 text-purple-500 dark:text-purple-400 text-[12px] font-bold ml-1 align-middle';
                note.textContent = '✦'; 
                titleEl.appendChild(note);
            }

            const activeSubForCard = window.getSubjectContext();
            if (activeSubForCard && activeSubForCard.pendingNodeId === item.id) {
                const pendingBadge = document.createElement('span');
                pendingBadge.className = 'inline-block mt-1 text-[13px] ml-1.5 align-middle';
                pendingBadge.title = 'Pending Bookmark';
                pendingBadge.textContent = '🎯';
                titleEl.appendChild(pendingBadge);
            }

            textContainer.appendChild(titleEl);

            if (item.desc || item.isCategoryFolder) {
                const descEl = document.createElement('p');
                descEl.className = 'text-xs text-slate-500 dark:text-dark-subtext mt-1 whitespace-normal break-words leading-relaxed';
                descEl.textContent = item.isCategoryFolder ? `${children.length} Subject(s)` : item.desc;
                textContainer.appendChild(descEl);
            }

            content.appendChild(iconContainer);
            content.appendChild(textContainer);

            if (hasChildren || item.isCategoryFolder) {
                const chevron = document.createElement('div');
                chevron.innerHTML = `<i data-lucide="chevron-right" class="w-5 h-5 text-slate-300 dark:text-dark-subtext"></i>`;
                chevron.className = 'self-center pl-2';
                content.appendChild(chevron);
            }

            card.appendChild(content);
            return card;
        }

        window.cleanMarkdownSource = function(text) {
            if (!text) return '';
            return text
                .replace(/\*{4,}([^\*\n]+)\*{4,}/g, '**$1**')
                .replace(/\*{4,}([^\*\n]+)/g, '**$1**')
                .replace(/\*{3,}/g, '**');
        };

        window.htmlToMarkdown = function(element) {
            let md = '';
            function walk(node) {
                if (node.nodeType === Node.TEXT_NODE) return node.nodeValue;
                if (node.nodeType !== Node.ELEMENT_NODE) return '';

                let inner = '';
                node.childNodes.forEach(child => { inner += walk(child); });

                const tag = node.tagName.toLowerCase();
                switch (tag) {
                    case 'h1': return `\n# ${inner.trim()}\n\n`;
                    case 'h2': return `\n## ${inner.trim()}\n\n`;
                    case 'h3': return `\n### ${inner.trim()}\n\n`;
                    case 'p': return `${inner.trim()}\n\n`;
                    case 'div': return `${inner}\n`;
                    case 'br': return `\n`;
                    case 'strong':
                    case 'b': {
                        const trimmed = inner.trim();
                        return trimmed ? ` **${trimmed}** ` : '';
                    }
                    case 'em':
                    case 'i': {
                        const trimmed = inner.trim();
                        return trimmed ? ` *${trimmed}* ` : '';
                    }
                    case 'u': return `<u>${inner}</u>`;
                    case 's':
                    case 'strike':
                    case 'del': return `~~${inner}~~`;
                    case 'mark': {
                        const style = node.getAttribute('style') || 'background:#fef08a; color:#000;';
                        return `<mark style="${style}">${inner}</mark>`;
                    }
                    case 'span': {
                        if (node.id && node.id.startsWith('anc-')) {
                            return `<span id="${node.id}">${inner.trim()}</span>`;
                        }
                        const style = node.getAttribute('style');
                        if (style) return `<span style="${style}">${inner}</span>`;
                        return inner;
                    }
                    case 'a': {
                        const href = node.getAttribute('href') || '#';
                        return `[${inner}](${href})`;
                    }
                    case 'ul': return `\n${inner}\n`;
                    case 'ol': return `\n${inner}\n`;
                    case 'li': return `- ${inner.trim()}\n`;
                    case 'blockquote': return `\n> ${inner.trim()}\n\n`;
                    case 'code': return `\`${inner}\``;
                    case 'pre': return `\n\`\`\`\n${inner.trim()}\n\`\`\`\n\n`;
                    default: return inner;
                }
            }

            element.childNodes.forEach(child => { md += walk(child); });
            return md.replace(/\n{3,}/g, '\n\n').trim();
        };

        window.getNotesArray = function(item) {
            if (!item || !item.notes) return [''];
            if (Array.isArray(item.notes)) {
                return item.notes.length > 0 ? [...item.notes] : [''];
            }
            if (typeof item.notes === 'string' && item.notes.trim()) {
                return [item.notes];
            }
            return [''];
        };

        window.renderNotesTabs = function() {
            const container = document.getElementById('notesTabsList');
            if (!container) return;
            container.innerHTML = '';
            
            currentNotesList.forEach((note, idx) => {
                const btn = document.createElement('button');
                const isActive = idx === activeNoteIdx;
                btn.className = `px-3.5 py-1.5 text-xs font-semibold rounded-lg flex items-center gap-1.5 transition-all whitespace-nowrap select-none ${
                    isActive 
                        ? 'bg-purple-600 text-white shadow-sm' 
                        : 'bg-slate-100 dark:bg-dark-hover text-slate-600 dark:text-dark-subtext hover:bg-slate-200 dark:hover:bg-dark-border'
                }`;
                
                btn.innerHTML = `<span>Note ${idx + 1}</span>`;
                btn.title = "Tap to view, long press to delete";

                let longPressTimer = null;
                let isDragging = false;
                let startX = 0, startY = 0;
                let longPressTriggered = false;

                const startPress = (x, y) => {
                    isDragging = false;
                    longPressTriggered = false;
                    startX = x;
                    startY = y;
                    longPressTimer = setTimeout(() => {
                        longPressTriggered = true;
                        if (navigator.vibrate) navigator.vibrate(50);
                        if (confirm(`Delete Note ${idx + 1}?`)) {
                            window.deleteCurrentNoteTab(idx);
                        }
                    }, 500);
                };

                const movePress = (x, y) => {
                    if (Math.abs(x - startX) > 10 || Math.abs(y - startY) > 10) {
                        isDragging = true;
                        clearTimeout(longPressTimer);
                    }
                };

                const cancelPress = () => clearTimeout(longPressTimer);

                btn.addEventListener('touchstart', (e) => startPress(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
                btn.addEventListener('touchmove', (e) => movePress(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
                btn.addEventListener('touchend', cancelPress);
                btn.addEventListener('touchcancel', cancelPress);

                btn.addEventListener('mousedown', (e) => {
                    if (e.button === 0) startPress(e.clientX, e.clientY);
                });
                btn.addEventListener('mousemove', (e) => {
                    if (e.buttons === 1) movePress(e.clientX, e.clientY);
                });
                btn.addEventListener('mouseup', cancelPress);
                btn.addEventListener('mouseleave', cancelPress);

                btn.oncontextmenu = (e) => e.preventDefault();

                btn.onclick = (e) => {
                    if (longPressTriggered || isDragging) {
                        e.stopPropagation();
                        e.preventDefault();
                        return;
                    }
                    if (activeNoteIdx !== idx) {
                        window.finishEditingNote();
                        activeNoteIdx = idx;
                        window.renderNotesTabs();
                        window.loadActiveNoteContent();
                    }
                };

                container.appendChild(btn);
            });
        };

        // --- ACTIVE RIBBON STATE DETECTION ---
        window.rgbToHex = function(rgb) {
            if (!rgb) return '';
            if (rgb.startsWith('#')) return rgb.toLowerCase();
            const m = rgb.match(/\d+/g);
            if (!m || m.length < 3) return '';
            const r = parseInt(m[0], 10).toString(16).padStart(2, '0');
            const g = parseInt(m[1], 10).toString(16).padStart(2, '0');
            const b = parseInt(m[2], 10).toString(16).padStart(2, '0');
            return `#${r}${g}${b}`.toLowerCase();
        };

        window.updateRibbonState = function() {
            const preview = document.getElementById('notesPreview');
            const sel = window.getSelection();

            const btnBold = document.getElementById('btn-bold');
            const btnItalic = document.getElementById('btn-italic');
            const btnUnderline = document.getElementById('btn-underline');
            const btnStrike = document.getElementById('btn-strike');
            const btnH1 = document.getElementById('btn-h1');
            const btnH2 = document.getElementById('btn-h2');
            const btnH3 = document.getElementById('btn-h3');
            const btnHighlight = document.getElementById('btn-highlight');
            const colorDots = document.querySelectorAll('.color-dot');

            const clearAllActive = () => {
                [btnBold, btnItalic, btnUnderline, btnStrike, btnH1, btnH2, btnH3, btnHighlight].forEach(btn => {
                    if (btn) btn.classList.remove('ribbon-btn-active');
                });
                colorDots.forEach(dot => dot.classList.remove('color-dot-active'));
            };

            if (!sel || !sel.rangeCount || !preview) {
                clearAllActive();
                return;
            }

            let node = sel.anchorNode;
            if (!node) { clearAllActive(); return; }
            if (node.nodeType === Node.TEXT_NODE) node = node.parentNode;
            if (!preview.contains(node)) { clearAllActive(); return; }

            clearAllActive();

            // Native browser state check
            if (document.queryCommandState('bold')) btnBold?.classList.add('ribbon-btn-active');
            if (document.queryCommandState('italic')) btnItalic?.classList.add('ribbon-btn-active');
            if (document.queryCommandState('underline')) btnUnderline?.classList.add('ribbon-btn-active');
            if (document.queryCommandState('strikeThrough')) btnStrike?.classList.add('ribbon-btn-active');

            // DOM traversal for elements, colors, and marks
            let curr = node;
            let foundColor = false;
            let foundHighlight = false;

            while (curr && curr !== preview) {
                const tag = curr.tagName ? curr.tagName.toLowerCase() : '';
                
                if (tag === 'b' || tag === 'strong') btnBold?.classList.add('ribbon-btn-active');
                if (tag === 'i' || tag === 'em') btnItalic?.classList.add('ribbon-btn-active');
                if (tag === 'u') btnUnderline?.classList.add('ribbon-btn-active');
                if (tag === 's' || tag === 'strike' || tag === 'del') btnStrike?.classList.add('ribbon-btn-active');
                if (tag === 'h1') btnH1?.classList.add('ribbon-btn-active');
                if (tag === 'h2') btnH2?.classList.add('ribbon-btn-active');
                if (tag === 'h3') btnH3?.classList.add('ribbon-btn-active');

                if (tag === 'mark' || curr.style?.backgroundColor === 'rgb(254, 240, 138)' || curr.style?.backgroundColor === '#fef08a') {
                    if (!foundHighlight) {
                        btnHighlight?.classList.add('ribbon-btn-active');
                        foundHighlight = true;
                    }
                }

                if (!foundColor && curr.style && curr.style.color) {
                    const hexColor = window.rgbToHex(curr.style.color);
                    colorDots.forEach(dot => {
                        const targetColor = (dot.getAttribute('data-color') || '').toLowerCase();
                        if (targetColor === hexColor) {
                            dot.classList.add('color-dot-active');
                            foundColor = true;

        // --- DIRECT WYSIWYG FORMATTING ACTIONS ---

        let noteHistoryStack = [];

        window.resetNoteHistory = function() {
            const preview = document.getElementById('notesPreview');
            const currentHtml = preview ? preview.innerHTML : '';
            noteHistoryStack = [currentHtml];
            noteHistoryIndex = 0;
            window.updateUndoRedoButtons();
        };

        window.recordNoteSnapshot = function() {
            const preview = document.getElementById('notesPreview');
            if (!preview) return;
            const currentHtml = preview.innerHTML;

            if (noteHistoryIndex >= 0 && noteHistoryStack[noteHistoryIndex] === currentHtml) {
                return;
            }

            if (noteHistoryIndex < noteHistoryStack.length - 1) {
                noteHistoryStack = noteHistoryStack.slice(0, noteHistoryIndex + 1);
            }

            noteHistoryStack.push(currentHtml);
            if (noteHistoryStack.length > 50) noteHistoryStack.shift();
            noteHistoryIndex = noteHistoryStack.length - 1;
            window.updateUndoRedoButtons();
        };

        window.updateUndoRedoButtons = function() {
            const undoBtn = document.getElementById('btn-undo');
            const redoBtn = document.getElementById('btn-redo');

            const canUndo = noteHistoryIndex > 0;
            const canRedo = noteHistoryIndex < noteHistoryStack.length - 1;

            if (undoBtn) {
                undoBtn.disabled = !canUndo;
                undoBtn.classList.toggle('opacity-40', !canUndo);
                undoBtn.classList.toggle('pointer-events-none', !canUndo);
            }
            if (redoBtn) {
                redoBtn.disabled = !canRedo;
                redoBtn.classList.toggle('opacity-40', !canRedo);
                redoBtn.classList.toggle('pointer-events-none', !canRedo);
            }
        };

        window.noteUndo = function() {
            window.startEditingNote();
            try {
                if (document.execCommand('undo')) {
                    window.updateRibbonState();
                    return;
                }
            } catch (e) {}

            if (noteHistoryIndex > 0) {
                noteHistoryIndex--;
                const preview = document.getElementById('notesPreview');
                preview.innerHTML = noteHistoryStack[noteHistoryIndex];
                window.updateUndoRedoButtons();
                window.updateRibbonState();

        window.escapeHtml = function(str) {
            return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        };

        window.replaceFirstOccurrence = function(str, findText, replaceWith, startIndex = 0) {
            if (!str || !findText) return { result: str || '', nextIndex: 0 };
            const escaped = findText.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            const sub = str.slice(startIndex);
            const match = sub.match(new RegExp(escaped));
            if (match && match.index !== undefined) {
                const actualIdx = startIndex + match.index;
                return {
                    result: str.substring(0, actualIdx) + replaceWith + str.substring(actualIdx + match[0].length),
                    nextIndex: actualIdx + replaceWith.length
                };
            }
            return {
                result: str + '\n\n' + replaceWith,
                nextIndex: (str + '\n\n' + replaceWith).length
            };
        };

        window.startStagedLink = function() {
            const sel = window.getSelection();
            let selectedText = "";
            if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {

            if (!selectedText) {

            const preview = document.getElementById('notesPreview');

            if (!banner || !ribbonGroup) return;

            if (stagedLink) {
                banner.classList.remove('hidden');

                const srcNum = stagedLink.sourceTabIdx + 1;
                bannerText.innerHTML = `Linking on Hold: <b>"${window.escapeHtml(stagedLink.sourceText)}"</b> in Notes ${srcNum}. Switch to any note tab, highlight target text, and tap Connect Link.`;

                ribbonGroup.innerHTML = `
                    <button id="btnConnectLink" class="ribbon-btn bg-purple-600 text-white hover:bg-purple-700 font-semibold shadow-sm" onclick="window.connectStagedLink()">🎯 Connect with Notes ${srcNum}</button>
                    <button id="btnCancelLink" class="ribbon-btn text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20" onclick="window.cancelStagedLink()">✖ Cancel</button>
                `;
            } else {
                banner.classList.add('hidden');
                banner.classList.remove('flex');

                // Delete button stays permanently visible right after Start Link
                const isLinkActive = !!window.activeClickedCrossLink;
                const deleteBtnStyle = isLinkActive 
                    ? 'text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/40 border-red-300 dark:border-red-800 font-semibold shadow-sm'
                    : 'text-slate-400 dark:text-dark-subtext opacity-60';

                ribbonGroup.innerHTML = `
                    <button id="btnStartLink" class="ribbon-btn text-purple-600 dark:text-purple-400 font-semibold" onclick="window.startStagedLink()">🔗 Start Link</button>
                    <button id="btnDeleteCrossLink" class="ribbon-btn ${deleteBtnStyle}" onclick="window.deleteActiveCrossLink()" title="Click a cross-note link, then click here to delete it">🗑️ Delete Link</button>
                `;
            }

            if (window.lucide) lucide.createIcons();

        window.deleteActiveCrossLink = function() {
            if (!window.activeClickedCrossLink) {
                alert("Please tap or click on a cross-note link first to select it for deletion.");
                return;
            }
            if (!confirm("Delete this cross-note link? (The text will be kept)")) return;

            const { sourceTabIdx, sourceAnchorId, targetTabIdx, targetAnchorId } = window.activeClickedCrossLink;

            function unwrapLink(text, a1, a2) {
                if (!text) return '';
                let res = text;
                [a1, a2].forEach(anc => {
                    if (!anc) return;
                    const rSpan = new RegExp('<span id="[^"]*">\\s*\\[([^\\]]+)\\]\\(#note:[^)]*' + anc + '[^)]*\\)\\s*<\\/span>', 'g');
                    res = res.replace(rSpan, '$1');
                    const rExact = new RegExp('<span id="' + anc + '">\\s*\\[([^\\]]+)\\]\\(#note:[^)]+\\)\\s*<\\/span>', 'g');
                    res = res.replace(rExact, '$1');
                    const rBare = new RegExp('\\[([^\\]]+)\\]\\(#note:[^)]*' + anc + '[^)]*\\)', 'g');
                    res = res.replace(rBare, '$1');
                });
                return res;
            }

            if (typeof sourceTabIdx === 'number' && currentNotesList[sourceTabIdx] !== undefined) {
                currentNotesList[sourceTabIdx] = unwrapLink(currentNotesList[sourceTabIdx], targetAnchorId, sourceAnchorId);
            }
            if (typeof targetTabIdx === 'number' && currentNotesList[targetTabIdx] !== undefined) {
                currentNotesList[targetTabIdx] = unwrapLink(currentNotesList[targetTabIdx], sourceAnchorId, targetAnchorId);
            }

            window.activeClickedCrossLink = null;
            window.updateStagedLinkUI();
            window.loadActiveNoteContent();
        };

        window.cancelStagedLink = function() {
            stagedLink = null;
            window.updateStagedLinkUI();
        };

        window.connectStagedLink = function() {
            if (!stagedLink) return;

            const sel = window.getSelection();
            let targetText = "";
            if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
                targetText = sel.toString().trim();
            }

            if (!targetText) {
                alert("Please highlight the target text in the destination note to connect.");
                return;
            }

            const preview = document.getElementById('notesPreview');
            if (preview && preview.isContentEditable) {
                currentNotesList[activeNoteIdx] = window.htmlToMarkdown(preview);
            }

            // Replace this block in connectStagedLink:
            const targetTabIdx = activeNoteIdx;
            const targetAnchorId = 'anc-' + Math.random().toString(36).substr(2, 7);
            const sourceTabIdx = stagedLink.sourceTabIdx;
            const sourceAnchorId = stagedLink.sourceAnchorId;
            const sourceText = stagedLink.sourceText;

            // --- CHANGED: Use 1-based tab numbers ---
            const targetTabNum = targetTabIdx + 1;
            const sourceTabNum = sourceTabIdx + 1;

            const forwardLinkHtml = `<span id="${sourceAnchorId}">[${sourceText}](#note:${targetTabNum}:${targetAnchorId})</span>`;
            const backLinkHtml = `<span id="${targetAnchorId}">[${targetText}](#note:${sourceTabNum}:${sourceAnchorId}?backlink=1)</span>`;

            if (sourceTabIdx === targetTabIdx) {
                let content = currentNotesList[sourceTabIdx] || '';
                const firstRes = window.replaceFirstOccurrence(content, sourceText, forwardLinkHtml, 0);
                content = firstRes.result;
                const startIdx = (sourceText === targetText) ? firstRes.nextIndex : 0;
                const secondRes = window.replaceFirstOccurrence(content, targetText, backLinkHtml, startIdx);
                currentNotesList[sourceTabIdx] = secondRes.result;
            } else {
                let srcContent = currentNotesList[sourceTabIdx] || '';
                currentNotesList[sourceTabIdx] = window.replaceFirstOccurrence(srcContent, sourceText, forwardLinkHtml, 0).result;

                let tgtContent = currentNotesList[targetTabIdx] || '';
                currentNotesList[targetTabIdx] = window.replaceFirstOccurrence(tgtContent, targetText, backLinkHtml, 0).result;
            }

            stagedLink = null;
            window.updateStagedLinkUI();
            window.loadActiveNoteContent();

            setTimeout(() => {
                const targetEl = document.getElementById(targetAnchorId);
                if (targetEl) {
                    targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    targetEl.classList.remove('sentence-highlight');
                    void targetEl.offsetWidth;
                    targetEl.classList.add('sentence-highlight');
                    setTimeout(() => targetEl.classList.remove('sentence-highlight'), 2400);
                }
            }, 150);
        };

        window.handleCrossNoteLinkClick = function(e, targetTabNum, targetAnchorId) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            const preview = document.getElementById('notesPreview');
            if (preview && preview.isContentEditable) {
                window.finishEditingNote();
            }

            // 1. Capture the anchor ID of the link that was clicked
            let sourceAnchorId = null;
            if (e && e.target) {
                const a = e.target.closest('a.cross-note-link') || e.target.closest('a');
                if (a) {
                    const span = a.closest('span[id^="anc-"]') || a.parentElement;
                    if (span && span.id && span.id.startsWith('anc-')) {
                        sourceAnchorId = span.id;
                    }
                }
            }

            // Convert 1-based number to 0-based array index (safely handles legacy 0-index)
            const targetIdx = targetTabNum > 0 ? targetTabNum - 1 : 0;
            const sourceTabIdx = activeNoteIdx;

            // 2. Register clicked link and activate the Delete Link button style.
            window.activeClickedCrossLink = {
                sourceTabIdx: sourceTabIdx,
                sourceAnchorId: sourceAnchorId,
                targetTabIdx: targetIdx,
                targetAnchorId: targetAnchorId
            };
            window.updateStagedLinkUI();

            if (targetIdx !== activeNoteIdx) {
                activeNoteIdx = targetIdx;
                window.renderNotesTabs();
                window.loadActiveNoteContent();
            }

            setTimeout(() => {
                let el = document.getElementById(targetAnchorId);
                if (!el) {
                    el = document.querySelector(`[id="${targetAnchorId}"]`);
                }
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    el.classList.remove('sentence-highlight');
                    void el.offsetWidth;
                    el.classList.add('sentence-highlight');
                    setTimeout(() => el.classList.remove('sentence-highlight'), 2400);
                }
            }, 120);
        };

        const previewEl = document.getElementById('notesPreview');

        window.renderPathList = function(container, pathArray) {
            container.innerHTML = '';
